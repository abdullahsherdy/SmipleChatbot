<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
<div class="container">
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                    <img src="https://img.icons8.com/color/48/000000/circled-user-female-skin-type-5--v1.png" alt="image">
                </div>
                <div class="chatbox__content--header">
                    <h4 class="chatbox__heading--header">Chat support</h4>
                    <p class="chatbox__description--header">Hi. My name is Sam. How can I help you?</p>
                </div>
            </div>
            <div class="chatbox__messages">
                <div id="chat-messages"></div>
            </div>
            <div class="chatbox__footer">
                <form id="chat-form" style="display: flex; align-items: center; width: 100%;">
                    <input type="text" id="chat-input" placeholder="Write a message..." style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
                    <button type="submit" id="send-btn" class="chatbox__send--footer send__button" 
                    style="margin-left: 10px; padding: 10px 15px; border-radius: 20px; background: var(--primaryGradient); color: white; border: none; cursor: pointer;">
                        Send
                    </button>
                </form>
            </div>
            
        </div>
        <div class="chatbox__button">
            <button id="chatbox-button"><img src="{{ url_for('static', filename='images/chatbox-icon.svg') }}" /></button>
        </div>
    </div>
</div>

<script>
    $SCRIPT_ROOT = {{ request.script_root|tojson }};
</script>
<script type="text/javascript" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
